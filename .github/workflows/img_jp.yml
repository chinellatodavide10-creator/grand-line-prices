name: Immagini giapponesi
on:
  workflow_dispatch:
    inputs:
      max_jp:
        description: "Quante immagini nuove scaricare in questo giro"
        default: "6000"
  schedule:
    - cron: "30 4 * * 1"
permissions:
  contents: write
concurrency:
  group: prezzi
  cancel-in-progress: false
jobs:
  jp:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python img_jp.py
        env:
          MAX_JP: ${{ github.event.inputs.max_jp || '6000' }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Immagini giapponesi" || echo "Nessuna modifica"
          git pull --rebase || true
          git push
