name: Aggiorna prezzi
on:
  workflow_dispatch:
    inputs:
      max_img:
        description: "Quante immagini nuove scaricare in questo giro"
        default: "2000"
  schedule:
    - cron: "0 * * * *"
permissions:
  contents: write
concurrency:
  group: prezzi
  cancel-in-progress: false
jobs:
  prezzi:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python prezzi.py
        env:
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
          MAX_IMG: ${{ github.event.inputs.max_img || '2000' }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Aggiorna prezzi" || echo "Nessuna modifica"
          git pull --rebase || true
          git push
